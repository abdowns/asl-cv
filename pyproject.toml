[project]
name = "asl-cv"
version = "0.1.0"
description = "Word-level ASL recognition and coaching from live video (WLASL, from-scratch hybrid ViT+TCN+GRU)"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
